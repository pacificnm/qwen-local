# Phase 1: static SPA + same-origin API proxy (no CORS by design).
# `listen 3000` is the locked tunnel target: chat.folding-os.com -> http://frontend:3000
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Phase 4 uploads (avatars etc.) are small; keep the default generous anyway
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API -> backend container (Docker DNS on the qwen network).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the proto seen by the previous hop (Cloudflare tunnel sends
        # https; LAN clients send nothing) so the backend can set the session
        # cookie's Secure flag to match the transport the browser used.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";

        # SSE: never buffer, keep long-lived streams open
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    # SPA fallback (client-side routes)
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
